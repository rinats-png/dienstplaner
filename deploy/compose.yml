# =====================================================================
#  CENTRIC Dienstplanung — Betrieb auf dem VPS
#  Ort auf dem Server: /opt/apps/centric-dienstplanung/compose.yml
#
#  Der Container veröffentlicht KEINEN Port. Erreichbar ist er nur für
#  Caddy über das gemeinsame Docker-Netzwerk "proxy" als
#  centric-dp-web:3000. Daten liegen unter ./data (Bind-Mount).
#
#  Befehle (im Verzeichnis /opt/apps/centric-dienstplanung):
#    ./digest-pruefen.sh sha256:<digest>      vor jedem Start/Wechsel
#    docker compose up -d --pull never        starten / nach Änderung neu erstellen
#    docker compose logs -f                   Logs
#    docker compose ps                        Status inkl. Healthcheck
#    ./ruecksprung.sh --trocken | ./ruecksprung.sh    zurück auf „vorherig“
#    ./abschalten.sh --trocken  | ./abschalten.sh     R0: Dienst anhalten
#
#  Bild NUR per Digest (WP-03). IMAGE_DIGEST kommt aus .env und muss in
#  FREIGEGEBENE-IMAGES.md mit Status aktiv oder vorherig stehen. Ohne
#  IMAGE_DIGEST bricht Compose ab — es gibt keinen Default, kein Tag und
#  kein latest. Die frühere Variable IMAGE_TAG wird NICHT mehr gelesen
#  (Migration: BEREITSTELLUNG.md, „Bild per Digest“).
# =====================================================================
name: centric-dienstplanung

services:
  centric-dp-web:
    image: ghcr.io/rinats-png/dienstplaner@${IMAGE_DIGEST:?IMAGE_DIGEST fehlt – nur verifizierte Digests (FREIGEGEBENE-IMAGES.md)}
    # Nie selbst ziehen: das Bild muss lokal liegen und vorher mit
    # ./digest-pruefen.sh geprüft sein (docker pull nur bewusst, per Digest).
    pull_policy: never
    container_name: centric-dp-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      CENTRIC_DATEN: /data
      CENTRIC_ABLAGE: dateien
      # Wiederherstellungsschutz der Sicherungsschlüssel (server/lib/schluesselepoche.mjs):
      # Schlüsselepoche AUSSERHALB von /data, nie mitsichern, nie zurückspielen.
      # Vor dem ersten Start: install -d -m 700 -o 1000 -g 1000 zustand
      # Fehlt das Verzeichnis oder ist es nicht schreibbar (Eigentümer uid 1000), gelten keine
      # Sicherungsschlüssel (fail-closed). Seit WR-2 hängen auch die Wiederherstellungscodes des
      # zweiten Faktors an dieser Epoche: Aktivieren eines Faktors, Neuerzeugen der Codes und
      # Anmelden mit einem Wiederherstellungscode antworten dann 503. Anmelden mit dem Code aus
      # der App und die übrigen Funktionen laufen weiter.
      CENTRIC_ZUSTAND: /zustand
      # CENTRIC_SELBSTSTART (öffentlicher Selbststart /starten) steht bewusst
      # NICHT hier: Vorgabe ist AUS. Einschalten nur über .env mit genau "true"
      # (docs/SELBSTSTART-SCHALTER.md).
      # CENTRIC_DEMO (öffentlicher Demozugang /api/demo, /api/demos) ebenso
      # NICHT hier: Vorgabe ist AUS (docs/DEMO-SCHALTER.md).
      # Überwachung (WP-05, docs/BETRIEB-UEBERWACHUNG.md): Alter der letzten
      # Sicherung außer Haus. Erst einschalten, wenn die Sicherung (WP-04)
      # eingerichtet ist — dann auch den Mount unten.
      # CENTRIC_SICHERUNG_STATUS: /sicherung-status/letzte-erfolgreiche.json

    networks:
      - proxy

    volumes:
      - ./data:/data                          # persistent, überlebt Neuerstellung
      - ./zustand:/zustand                    # Schlüsselepoche, NICHT in Sicherung/restic
      # - /home/admin/sicherung:/sicherung-status:ro   # WP-05, nur lesen (STATUS_VERZEICHNIS)

    # --- Härtung ---
    user: "1000:1000"                         # = admin auf dem Host, = node im Image
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: 512m

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/gesund').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
