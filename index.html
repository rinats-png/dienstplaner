<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="CENTRIC — Dienstplanung für rotierende Schichtbetriebe" />
    <title>CENTRIC</title>

    <!-- Symbole. Ohne diese Angaben setzt das Betriebssystem beim Ablegen auf
         dem Startbildschirm das Symbol des Browsers ein. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Eine Farbe für beide Fälle: Die Anwendung ist hell, unabhängig vom
         Systemthema. Die Anwendung setzt diese Angabe selbst um, wenn jemand
         ausdrücklich auf Dunkel stellt. -->
    <meta name="theme-color" content="#D9E4E8" />
    <!-- Beide Themen zulassen: Sonst bleiben Datumsauswahl, Auswahlfelder
         und Bildlaufleisten im Dunkelmodus hell. Welches Thema gilt,
         entscheidet die Anwendung über data-thema am Wurzelelement. -->
    <meta name="color-scheme" content="light dark" />

    <!-- Apple kennt das Manifest nur teilweise und braucht eigene Angaben -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CENTRIC" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Vorschau beim Teilen eines Verweises -->
    <meta property="og:title" content="CENTRIC — Dienstplanung" />
    <meta property="og:description" content="Dienstplanung für rotierende Schichtbetriebe." />
    <meta property="og:image" content="/vorschau.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
