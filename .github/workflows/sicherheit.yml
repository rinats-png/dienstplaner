# Sicherheitsschranke — läuft bei jedem Push und Pull Request, getrennt
# von der fachlichen Prüfung, damit ein Befund hier als das sichtbar wird,
# was er ist: ein Grund, nicht auszuliefern.
#
# Drei Schritte:
#   Abhängigkeiten — bekannte Schwachstellen ab „hoch" brechen den Lauf.
#   Geheimnisse    — kein Schlüssel, kein Token, kein Kennwort im Verlauf.
#   Muster         — Aufrufe, die in dieser Anwendung nie vorkommen dürfen.
name: Sicherheit

on:
  push:
    branches: ["**"]
  pull_request:
  # Auslieferung (deploy.yml) ruft diese Schranke auf, bevor sie ein Bild baut.
  workflow_call:

permissions:
  contents: read

jobs:
  abhaengigkeiten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Nur die Laufzeitabhängigkeiten zählen als Ausschluss. Werkzeuge der
      # Entwicklung werden gemeldet, halten aber nicht auf.
      - name: Bekannte Schwachstellen (Laufzeit)
        run: npm audit --omit=dev --audit-level=high
      - name: Bekannte Schwachstellen (Entwicklung, nur Hinweis)
        run: npm audit --audit-level=high || true

  geheimnisse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Geheimnisse im Verlauf
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Interne Sicherheitsprüfung 2026-11 (docs/acc45/SICHERHEIT-INTERN-2026-11.md):
  # Regressionstests der Befunde, Routen-Inventar (Pflicht-Sondenprüfung),
  # statische Prüfung, eigener Geheimnis-Lauf über die ganze Historie und die
  # Wiederherstellungsübung mit synthetischen Daten. Fremde Actions per SHA.
  interne-pruefung:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Regressionstests und Routen-Inventar
        run: npm run pruefung:sicherheit-intern
      - name: Statische Prüfung (ESLint-Sicherheitsregeln, Muster)
        run: npm run sicherheit:statik
      - name: Geheimnisse in der gesamten Historie (ohne Werte)
        run: npm run sicherheit:geheimnisse
      - name: Lockfile (ohne Netz)
        run: node werkzeug/sicherheit/abhaengigkeiten.mjs --ohne-audit
      - name: Wiederherstellungsübung
        run: npm run sicherheit:wiederherstellung

  muster:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # SI-P8: Fremde Actions nur per vollständigem Commit-SHA mit
      # Versionskommentar (ohne Abhängigkeiten, ohne Netz).
      - name: Actions per Commit-SHA gepinnt
        run: node werkzeug/sicherheit/actions-pins.mjs
      # Was es in dieser Anwendung nicht geben darf. Die Liste ist kurz und
      # bewusst hart: Jeder Treffer bricht den Lauf.
      - name: Verbotene Muster
        run: |
          set -e
          fehl=0
          pruefe() {
            if grep -rnE "$1" src server --include=*.js --include=*.jsx --include=*.mjs; then
              echo "::error::$2"; fehl=1
            fi
          }
          pruefe "dangerouslySetInnerHTML|\.innerHTML\s*=|\beval\(|new Function\(" "Roh-HTML oder eval im Quelltext"
          pruefe "Access-Control-Allow-Origin[^\n]*\*" "CORS pauschal geöffnet"
          pruefe "rejectUnauthorized:\s*false|NODE_TLS_REJECT_UNAUTHORIZED" "TLS-Prüfung abgeschaltet"
          pruefe "CENTRIC_PFEFFER\s*=\s*[\"']|RESEND_API_KEY\s*=\s*[\"']|REDIS_REST_TOKEN\s*=\s*[\"']" "Geheimnis im Quelltext"
          if [ -e .env ] || [ -e .env.production ]; then echo "::error::.env im Arbeitsverzeichnis"; fehl=1; fi
          exit $fehl
