# Lieferkette — das Bild, das ausgeliefert würde, auf bekannte Schwachstellen
# prüfen (WP-32).
#
# `npm audit` (sicherheit.yml) sieht nur package-lock.json. Im Bild steckt
# mehr: Alpine mit seinen Systempaketen, Node selbst, das mitgelieferte npm.
# Trivy liest das fertige Bild und findet alles davon.
#
# Gate: CRITICAL und HIGH, aber nur, wenn es eine behobene Fassung gibt
# (ignore-unfixed). Ein Befund ohne Fix lässt sich mit keinem Commit
# beheben — er wird angezeigt, hält aber nicht auf. Bekannte Ausnahmen nur
# in .trivyignore, jede mit Begründung und Ablaufdatum (exp:JJJJ-MM-TT);
# nach dem Datum gilt der Befund wieder.
#
# Wöchentlich zusätzlich: Neue Meldungen erscheinen, ohne dass sich am
# Quelltext etwas ändert. Der Montagslauf zeigt sie, auch wenn eine Woche
# lang niemand pusht.
#
# Jede fremde Action ist per Commit-SHA gepinnt (Kommentar: Version), Trivy
# selbst per Image-Digest. Ein Tag laesst sich umhaengen - bei trivy-action
# ist genau das im Maerz 2026 geschehen. trivy-action/setup-trivy werden
# nicht mehr benutzt (Ursache und Betrieb: docs/CI-LIEFERKETTE.md).
name: Lieferkette

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Die Caddy-Vorlage (deploy/caddy/Caddyfile.vorlage) muss sich übersetzen
  # lassen — sonst ist sie im Ernstfall eine Fehlerquelle mehr. Geprüft mit
  # dem offiziellen Bild, per Digest gepinnt (caddy:2-alpine, 2.11.7, Stand
  # 2026-11-02). `caddy validate` lädt die Konfiguration samt Modulen, holt
  # aber kein Zertifikat und erreicht kein Upstream.
  caddy-vorlage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: caddy validate
        run: |
          docker run --rm --network none \
            -v "$PWD/deploy/caddy/Caddyfile.vorlage:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  bild-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BILD: centric-lieferkette:${{ github.sha }}
      TRIVY_BILD: ghcr.io/aquasecurity/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
      TRIVY_CACHE: ${{ runner.temp }}/trivy-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Dasselbe Dockerfile wie in pruefung.yml und deploy.yml, nur geladen,
      # nie geschoben.
      - name: Bild bauen (lokal)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.BILD }}

      # Trivy kommt als offizielles Container-Image, per Digest gepinnt
      # (ghcr.io/aquasecurity/trivy 0.70.0, Multi-Arch-Index). Grund: Das
      # Installationsskript von setup-trivy lud das Binary von github.com
      # und scheiterte seit 2026-11-03 bei jedem Lauf ohne Cache-Treffer
      # (curl Exit 6, Namensaufloesung) - der Scan lief dann nie. Das Bild
      # kommt ueber Docker-Daemon und Registry; der Digest macht es
      # unveraenderlich. Scanumfang und Gate sind unveraendert.
      - name: Trivy-Bild holen (Digest-gepinnt)
        run: docker pull "$TRIVY_BILD"

      # Datenbank einmal laden; das Gate nutzt dieselbe (--skip-db-update).
      # Scheitert der Bezug, scheitert der Job - es wird nie ohne Scan gruen.
      - name: Schwachstellen-Datenbank laden
        run: |
          mkdir -p "$TRIVY_CACHE"
          docker run --rm -v "$TRIVY_CACHE:/root/.cache/trivy" "$TRIVY_BILD"             image --download-db-only

      # Erst der volle Bericht ueber alle Schweregrade, ohne Abbruch - damit
      # im Protokoll steht, was es gibt, nicht nur, was aufhaelt.
      - name: Bericht (alle Schweregrade, hält nicht auf)
        run: |
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "$TRIVY_CACHE:/root/.cache/trivy"             "$TRIVY_BILD" image --skip-db-update             --format table             --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL             --exit-code 0             "$BILD"

      # Das Gate: CRITICAL/HIGH mit verfuegbarem Fix, Exit 1 = rot.
      # Kein continue-on-error, kein Ueberspringen.
      - name: Gate (CRITICAL/HIGH mit verfügbarem Fix)
        run: |
          docker run --rm             -v /var/run/docker.sock:/var/run/docker.sock             -v "$TRIVY_CACHE:/root/.cache/trivy"             -v "$PWD/.trivyignore:/.trivyignore:ro"             "$TRIVY_BILD" image --skip-db-update             --format table             --severity HIGH,CRITICAL             --ignore-unfixed             --ignorefile /.trivyignore             --exit-code 1             "$BILD"
