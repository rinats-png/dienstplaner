# Auslieferung als Container (WP-31).
#
# Zwei getrennte Teile, beide nur von Hand (workflow_dispatch):
#
#   bild  baut das Bild, prüft es mit der Rechteprüfung gegen den laufenden
#         Container und lädt es nach GHCR (Eingabe „bauen“, Vorgabe an).
#   vps   liefert einen DIGEST aus — nie ein Kennzeichen, nie latest —, nur
#         nach Freigabe in der GitHub-Umgebung „produktion“. Auf dem VPS
#         läuft deploy/deploy.sh als Forced Command: Freigabeliste, Sperre,
#         Pull nur dieses Digests, Sicherung, Wechsel, healthy, Smoke,
#         Manifestabgleich, bei Fehler R0 (abschalten.sh) oder — nur auf
#         ausdrücklichen Wunsch — Rücksprung auf „vorherig“.
#
# Sperrvermerk WP-03 — Stand WP-31: Die Bedingungen, unter denen der Job
# `vps` gesperrt war (Kennzeichen statt Digest, Rollback auf ein beliebiges
# voriges Kennzeichen, kein digest-pruefen.sh, kein R0), sind mit
# deploy/deploy.sh behoben. Der Job ist TROTZDEM erst nutzbar, wenn der
# Inhaber
#   - die Umgebung „produktion“ mit Pflicht-Prüfer anlegt,
#   - dort DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY und DEPLOY_KNOWN_HOSTS
#     hinterlegt,
#   - deploy.sh, deploy-smoke.mjs, deploy-abgleich.mjs auf den VPS kopiert
#     und die Forced-Command-Zeile einträgt,
#   - CENTRIC_VERTRAUTE_PROXYS in der Produktions-.env setzt.
# Bis dahin gilt BEREITSTELLUNG.md Schritt 3 (von Hand, per Digest).
# Anleitung: docs/DEPLOY-AUTOMATISIERUNG.md. Nichts davon legt dieser
# Workflow an.
name: Auslieferung

on:
  workflow_dispatch:
    inputs:
      bauen:
        description: "Bild bauen, prüfen und nach GHCR laden?"
        type: boolean
        default: true
      ausliefern:
        description: "Einen freigegebenen Digest auf den VPS ausliefern? (braucht Freigabe in der Umgebung produktion)"
        type: boolean
        default: false
      digest:
        description: "Digest aus FREIGEGEBENE-IMAGES.md (sha256:<64 hex>), kein Tag"
        type: string
        default: ""
      bei_fehler:
        description: "Bei Fehler: r0 = Dienst anhalten (Standard); ruecksprung = auf vorherig, sonst R0"
        type: choice
        options: ["r0", "ruecksprung"]
        default: "r0"
      trocken:
        description: "Nur Trockenlauf auf dem VPS (prüft und zeigt den Plan, ändert nichts)"
        type: boolean
        default: false
  # Bewusst KEIN push-Auslöser: Ausgeliefert wird nur ein abgenommener
  # Digest, nach menschlicher Freigabe.

# Vorgabe für alle Jobs: nur lesen. Schreibrechte bekommt nur `bild` (GHCR).
permissions:
  contents: read

env:
  BILD: ghcr.io/${{ github.repository }}
  VITE_ANWENDUNG_URL: ${{ vars.VITE_ANWENDUNG_URL || 'https://app.centric-dienstplanung.de' }}
  VITE_KONTAKT_MAIL: ${{ vars.VITE_KONTAKT_MAIL || 'info@centric-dienstplanung.de' }}

jobs:
  # -------------------------------------------------------------------
  # 0. Das volle Gate — dieselben Workflows, die bei jedem Push laufen.
  #    Schlägt einer fehl, entsteht kein Bild, geht nichts nach GHCR und
  #    läuft kein Schritt auf den VPS. Es gibt keinen Weg um das Gate:
  #    `bild` und `vps` hängen beide daran (`vps` nicht an `bild` — er
  #    liefert einen abgenommenen Digest aus, nicht das eben gebaute Bild).
  # -------------------------------------------------------------------
  pruefung:
    uses: ./.github/workflows/pruefung.yml

  sicherheit:
    uses: ./.github/workflows/sicherheit.yml

  # -------------------------------------------------------------------
  # 1. Bauen, gegen den laufenden Container prüfen, nach GHCR laden
  # -------------------------------------------------------------------
  bild:
    needs: [pruefung, sicherheit]
    if: ${{ inputs.bauen }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Kennzeichen (git-SHA und latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BILD }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bild bauen (lokal, für die Prüfung)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          # Labels aus metadata-action, u. a. org.opencontainers.image.revision
          # (= Commit). digest-pruefen.sh gleicht es mit FREIGEGEBENE-IMAGES.md ab.
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_ANWENDUNG_URL=${{ env.VITE_ANWENDUNG_URL }}
            VITE_KONTAKT_MAIL=${{ env.VITE_KONTAKT_MAIL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Der Container läuft hier genau so gehärtet wie später auf dem VPS.
      - name: Container starten
        run: |
          docker run -d --name centric-pruefung -p 127.0.0.1:3000:3000 \
            -e CENTRIC_ADMIN=ci-geheim -e CENTRIC_PFEFFER=ci-pfeffer-nur-zum-pruefen \
            -e CENTRIC_SELBSTSTART=true \
            -e CENTRIC_BASIS=http://127.0.0.1:3000 \
            -e CENTRIC_VERTRAUTE_PROXYS=127.0.0.1,::1,172.16.0.0/12 \
            --user 1000:1000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 512m \
            "${BILD}:${{ steps.meta.outputs.version }}"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/gesund >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/gesund

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Dieselbe Rechteprüfung wie in pruefung.yml — nur gegen das Bild,
      # das ausgeliefert wird, statt gegen den Entwicklungsserver.
      - name: Rechteprüfung gegen den Container
        run: npm run pruefung:rechte
        env:
          CENTRIC_BASIS: http://127.0.0.1:3000
          CENTRIC_ADMIN: ci-geheim
          CENTRIC_HERKUNFT: 10.9.8.9

      - name: Container-Logs (bei Fehler)
        if: failure()
        run: docker logs centric-pruefung

      - name: GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bild nach GHCR laden
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Labels aus metadata-action, u. a. org.opencontainers.image.revision
          # (= Commit). digest-pruefen.sh gleicht es mit FREIGEGEBENE-IMAGES.md ab.
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_ANWENDUNG_URL=${{ env.VITE_ANWENDUNG_URL }}
            VITE_KONTAKT_MAIL=${{ env.VITE_KONTAKT_MAIL }}
          cache-from: type=gha

  # -------------------------------------------------------------------
  # 2. Auf den VPS (WP-31) — nur mit Freigabe in der GitHub-Umgebung
  #    „produktion“ und nur per Digest aus FREIGEGEBENE-IMAGES.md.
  #
  #    Unabhängig vom Bau: ausgeliefert wird nicht das eben gebaute Bild,
  #    sondern ein Digest, der abgenommen und auf dem VPS in der
  #    Freigabeliste als aktiv (oder vorherig) steht. deploy.sh prüft das
  #    selbst noch einmal — dieser Job reicht nur den Digest durch.
  #
  #    Der SSH-Schlüssel darf auf dem VPS genau eines: deploy.sh --ssh
  #    (Forced Command, docs/DEPLOY-AUTOMATISIERUNG.md). Was hier als Befehl
  #    geschickt wird, prüft deploy.sh gegen eine feste Form; alles andere
  #    wird abgewiesen.
  #
  #    Läuft nur, wenn (a) beim Start ausdrücklich angefordert, (b) die
  #    Umgebung „produktion“ den Lauf freigibt (Pflicht-Prüfer in den
  #    Repository-Einstellungen) und (c) DEPLOY_HOST dort gesetzt ist.
  #    Nichts davon legt dieser Workflow selbst an.
  # -------------------------------------------------------------------
  vps:
    needs: [pruefung, sicherheit]
    # Nur von main (N2) — zusätzlich zur Einschränkung der Umgebung auf main.
    if: ${{ inputs.ausliefern && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produktion
    concurrency:
      group: produktion
      cancel-in-progress: false
    env:
      DIGEST: ${{ inputs.digest }}
      BEI_FEHLER: ${{ inputs.bei_fehler }}
      TROCKEN: ${{ inputs.trocken }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
    steps:
      - name: Eingaben prüfen (Digest, kein Tag)
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Eingabe digest ist kein Digest (sha256:<64 hex>); Tags sind nicht zulässig."; exit 1; }
          [[ "$BEI_FEHLER" == "r0" || "$BEI_FEHLER" == "ruecksprung" ]] || { echo "::error::bei_fehler unbekannt"; exit 1; }
          [[ -n "$DEPLOY_HOST" ]] || { echo "::error::Variable DEPLOY_HOST der Umgebung produktion fehlt"; exit 1; }
          [[ -n "$DEPLOY_USER" ]] || { echo "::error::Variable DEPLOY_USER der Umgebung produktion fehlt"; exit 1; }

      - name: SSH-Zugang (Schlüssel und festgelegter Host-Schlüssel)
        env:
          SCHLUESSEL: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SCHLUESSEL" && -n "$HOSTS" ]] || { echo "::error::DEPLOY_SSH_KEY oder DEPLOY_KNOWN_HOSTS fehlt"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SCHLUESSEL" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: deploy.sh auf dem VPS (Forced Command)
        run: |
          set -euo pipefail
          befehl="deploy $DIGEST"
          [[ "$TROCKEN" == "true" ]] && befehl="$befehl --trocken"
          befehl="$befehl --bei-fehler=$BEI_FEHLER"
          echo "Befehl: $befehl"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "$befehl"

      - name: Schlüssel entfernen
        if: always()
        run: rm -f ~/.ssh/deploy
