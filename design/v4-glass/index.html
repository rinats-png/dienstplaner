    @media (max-width:460px){.metric-grid{grid-template-columns:1fr 1fr}.metric{min-height:123px;padding:13px}.metric small{font-size:11px}.metric strong{font-size:32px}.operator-mini{grid-template-columns:1fr 1fr}.profile-grid{grid-template-columns:1fr}.web-hero h1{font-size:48px}.floating{position:relative;right:auto;bottom:auto;width:100%;margin-top:11px}.mock-row{grid-template-columns:1.2fr repeat(4,.85fr)}.mock-row span{font-size:9px}.dialog{padding:19px}.month-grid{gap:4px}.month-day{min-height:64px;padding:7px 4px}.month-day strong{font-size:12px}.month-day span,.month-day small{font-size:9px}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media (prefers-reduced-transparency:reduce){.glass,.topbar,.mobile-footer{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--surface)!important}}
    .brand-approved{flex-direction:column;align-items:stretch;gap:4px}.brand-approved .brand-sub{padding-left:2px}.logo-switch{display:inline-flex;max-width:100%;width:191px;align-items:center;flex-shrink:0}.logo-switch img{width:100%;height:auto;display:block}.logo-switch .logo-light{display:none}body[data-theme="light"] .logo-switch .logo-dark{display:none}body[data-theme="light"] .logo-switch .logo-light{display:block}.web-nav .logo-switch{width:180px}@media(max-width:460px){.web-nav .logo-switch{width:150px}}

</head>
<body data-theme="dark">
  <div class="ambient" aria-hidden="true"></div>
  <div id="app"></div>
  <script>
  (()=>{
    'use strict';
    const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
    const DATES=['02','03','04','05','06','07','08'];
    const SHIFTS={F:{label:'Früh',time:'06:00–14:00'},S:{label:'Spät',time:'14:00–22:00'},N:{label:'Nacht',time:'22:00–06:00'},'-':{label:'Frei',time:'—'}};
    const PEOPLE=[
      {id:'p1',name:'Leonie Bauer',initials:'LB',team:'A',role:'Schichtverantwortung',quali:'Brandschutz',expiry:'31.03.2027',shifts:['F','F','S','S','F','-','-']},
      {id:'p2',name:'Tobias Schmidt',initials:'TS',team:'A',role:'Beschäftigter',quali:'Erste Hilfe',expiry:'17.01.2027',shifts:['S','S','N','-','F','F','S']},
      {id:'p3',name:'Fatma Kaya',initials:'FK',team:'B',role:'Beschäftigte',quali:'Brandschutz',expiry:'22.08.2027',shifts:['F','-','F','S','S','S','-']},
      {id:'p4',name:'Sofia Klein',initials:'SK',team:'B',role:'Schichtverantwortung',quali:'Erste Hilfe',expiry:'30.11.2026',shifts:['N','-','N','N','S','S','-']},
      {id:'p5',name:'Ben Tischer',initials:'BT',team:'C',role:'Beschäftigter',quali:'Objektschutz',expiry:'31.07.2027',shifts:['F','S','S','F','F','-','N']},
      {id:'p6',name:'Julia Krüger',initials:'JK',team:'C',role:'Beschäftigte',quali:'Erste Hilfe',expiry:'14.02.2027',shifts:['N','N','-','F','S','S','-']}
    ];
    const CLIENTS=[
      {id:'c1',name:'Pflegezentrum Mitte',tariff:'Business',status:'Aktiv',cycle:'Monatlich',sector:'Pflege'},
      {id:'c2',name:'Nordwache Sicherheit',tariff:'Basis',status:'Aktiv',cycle:'Monatlich',sector:'Sicherheit'},
      {id:'c3',name:'Klinikverbund',tariff:'Enterprise',status:'Pilot',cycle:'Monatlich',sector:'Klinik'},
      {id:'c4',name:'Logistik Zentrum West',tariff:'Business',status:'Aktiv',cycle:'Monatlich',sector:'Logistik'}
    ];
    const VIEWS=[['lage','Dienstlage','▣'],['plan','Monatsplan','▦'],['personal','Personal','♧'],['betreiber','Betreiber','◈'],['website','Website','↗']];
    const state={view:'lage',theme:localStorage.getItem('centric-v4-theme')==='light'?'light':'dark',glass:localStorage.getItem('centric-v4-glass')!=='off',nav:false,team:'Alle',search:'',person:'p1',personTab:'Profil',day:2,planMode:'Woche',operatorTab:'Übersicht',modal:null,toast:'',done:[],filter:'Alle'};
    let toastTimer=null;
    const E=(s)=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const icon=(s)=>({lage:'▣',plan:'▦',personal:'♧',betreiber:'◈',website:'↗'}[s]||'◇');
    const $=(q)=>document.querySelector(q);
    const brandLogo=()=>`<span class="logo-switch"><img class="logo-dark" src="assets/centric-logo-dunkel.svg" alt="CENTRIC"><img class="logo-light" src="assets/centric-logo-hell.svg" alt="CENTRIC"></span>`;
    const btn=(label,action,extra='',cls='btn')=>`<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
    const shift=(p,d)=>`<button class="shift ${p.shifts[d].toLowerCase()==='-'?'off':p.shifts[d].toLowerCase()}" data-action="edit-shift" data-id="${p.id}" data-day="${d}" aria-label="${E(p.name)}: ${E(SHIFTS[p.shifts[d]].label)} am ${DATES[d]}. November ändern">${p.shifts[d]==='-'?'—':`<b>${p.shifts[d]}</b><small>${SHIFTS[p.shifts[d]].time}</small>`}</button>`;
    function nav(){return `<aside class="sidebar glass ${state.nav?'open':''}" id="nav" aria-label="Hauptnavigation">
      <div class="brand brand-approved">${brandLogo()}<small class="brand-sub">V4 · GLASS STUDIO</small></div>
      <div class="nav-label">Anwendung & Marke</div><nav class="nav">${VIEWS.map(([id,name,sym])=>`<button data-action="view" data-view="${id}" class="${state.view===id?'active':''}" ${state.view===id?'aria-current="page"':''}><span class="ni" aria-hidden="true">${sym}</span>${name}</button>`).join('')}<div class="divider"></div></nav>
      <div class="nav-label">Ansicht</div><nav class="nav"><button data-action="theme"><span class="ni">${state.theme==='dark'?'☼':'☾'}</span>${state.theme==='dark'?'Heller Modus':'Dunkler Modus'}</button><button data-action="glass"><span class="ni">◌</span>Glass ${state.glass?'aktiv':'deaktiviert'}</button></nav>
      <div class="side-bottom"><b><span class="dot"></span> Unabhängige Designvorschau</b>Nur Beispieldaten. Keine Verbindung zum produktiven CENTRIC.</div>
    </aside>`}
    function top(){return `<header class="topbar"><div class="row"><button class="icon-btn mobile-menu-button" data-action="menu" aria-label="Navigation öffnen" aria-expanded="${state.nav}">☰</button><div><div class="crumb">CENTRIC / V4 / ${E(VIEWS.find(v=>v[0]===state.view)?.[1]||'')}</div><div class="tiny desktop-only">Interaktiver Entwurf · Stand 04.11.2026</div></div></div>
      <div class="top-actions">${btn(`<span class="button-label">${state.glass?'Glass an':'Glass aus'}</span> ◌`,'glass','','btn ghost small')}${btn(state.theme==='dark'?'☼ <span class="button-label">Hell</span>':'☾ <span class="button-label">Dunkel</span>','theme','','btn ghost small')}<span class="preview-flag desktop-only">● Testdaten</span><div class="avatar" aria-label="Vorschauprofil">V4</div></div></header>`}
    function mobileFoot(){return `<nav class="mobile-footer" aria-label="Mobile Navigation">${VIEWS.map(([id,name])=>`<button data-action="view" data-view="${id}" class="${state.view===id?'active':''}" ${state.view===id?'aria-current="page"':''}><b aria-hidden="true">${icon(id)}</b>${name}</button>`).join('')}</nav>`}
    function metric(label,value,symbol,meta=''){return `<article class="card glass metric"><div class="row between"><small>${E(label)}</small><span class="mark" aria-hidden="true">${symbol}</span></div><strong>${E(value)}</strong><div class="tiny">${meta}</div></article>`}
    function lage(){return `<section><div class="eyebrow">Betrieb Süd / Aktueller Dienst</div><h1 class="hero-title">Guten Morgen,<br><em>Rinat.</em></h1><p class="lead">Mittwoch, 4. November 2026 · Die wichtigsten Entscheidungen auf einen Blick.</p>
      <div class="metric-grid">${metric('Heute im Dienst','42','♧','Planstand · Beispieldaten')}${metric('Offene Schichten','3','▦','2 heute · 1 morgen')}${metric('Anträge zu prüfen','2','▤','Freigabe ausstehend')}${metric('Besetzung','95 %','◉','42 von 44 geplant')}</div>
      <div class="two-col"><article class="card"><div class="card-header"><div><h2 class="section-label">Dienstbesetzung heute</h2><p class="tiny">Soll und geplante Besetzung nach Dienst</p></div><span class="pill soft">Heute</span></div>
        <div class="coverage"><div class="cover-row"><div><b>Frühdienst</b><span>06–14 Uhr</span></div><div class="bar"><div style="width:100%"></div><span class="bar-label">14 / 14</span></div><b class="ratio">100 %</b></div><div class="cover-row"><div><b>Spätdienst</b><span>14–22 Uhr</span></div><div class="bar warn"><div style="width:84%"></div><span class="bar-label">10 / 12</span></div><b class="ratio">83 %</b></div><div class="cover-row"><div><b>Nachtdienst</b><span>22–06 Uhr</span></div><div class="bar"><div style="width:100%"></div><span class="bar-label">8 / 8</span></div><b class="ratio">100 %</b></div></div>
        <div class="legend"><span><i></i> Ausreichend besetzt</span><span><i class="amber"></i> Unterbesetzt</span></div><div class="row" style="margin-top:24px">${btn('Monatsplan öffnen ↗','view','data-view="plan"','btn primary')}</div></article>
      <aside class="card glass"><div class="card-header"><h2 class="section-label">Jetzt wichtig</h2><span class="pill amber">3 Punkte</span></div>
        <button class="task" data-action="view" data-view="plan"><span><strong>3 Dienste unbesetzt</strong><small>Planung ansehen und prüfen</small></span><span class="arrow">→</span></button><button class="task" data-action="toast" data-message="Anträge gehören zur bestehenden CENTRIC-App. Diese V4-Vorschau zeigt nur das UI-Konzept."><span><strong>2 Anträge offen</strong><small>Genehmigungen im bestehenden Produkt</small></span><span class="arrow">→</span></button><button class="task" data-action="view" data-view="personal"><span><strong>1 Nachweis läuft ab</strong><small>Qualifikationen im Blick behalten</small></span><span class="arrow">→</span></button></aside></div></section>`}
    function plan(){const pp=PEOPLE.filter(p=>state.team==='Alle'||p.team===state.team);return `<section><div class="page-head"><div><div class="eyebrow">Planung / November 2026</div><h1>Monatsplan<span style="color:var(--accent)">.</span></h1><p class="lead">Planungsansicht mit Demoänderungen. Keine echte Regel- oder Rechtsprüfung.</p></div>${btn('Demo zurücksetzen','reset-plan','','btn ghost small')}</div>
      <div class="toolbar"><label class="tiny" for="teamFilter">Team</label><select id="teamFilter" class="select" data-select="team"><option>Alle</option>${['A','B','C'].map(t=>`<option ${state.team===t?'selected':''}>${t}</option>`).join('')}</select><div class="tabs" role="tablist" aria-label="Zeitraum">${['Tag','Woche','Monat'].map(m=>`<button data-action="plan-mode" data-mode="${m}" role="tab" aria-selected="${state.planMode===m}">${m}</button>`).join('')}</div><span class="pill soft">KW 45 · 02.–08.11.</span></div>
      <div class="shift-grid"><div><div class="desktop-plan planner-wrap"><table class="planner-table"><thead><tr><th scope="col">Mitarbeitende</th>${DAYS.map((d,i)=>`<th scope="col">${d}<br>${DATES[i]}.11.</th>`).join('')}</tr></thead><tbody>${pp.map(p=>`<tr><td>${E(p.name)} <span class="tiny">· ${p.team}</span></td>${DATES.map((_,i)=>`<td>${shift(p,i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <div class="mobile-plan card"><div class="section-label">Tagesansicht</div><div class="days">${DAYS.map((d,i)=>`<button class="day-btn ${state.day===i?'active':''}" data-action="day" data-day="${i}">${d}<small>${DATES[i]}.11.</small></button>`).join('')}</div>${pp.map(p=>`<div class="shift-line"><div><b>${E(p.name)}</b><div class="tiny">Team ${p.team}</div></div>${shift(p,state.day)}</div>`).join('')}</div>
        <div class="card" style="margin-top:15px"><div class="card-header"><h2 class="section-label">Planungslegende</h2><span class="tiny">Beispielwoche</span></div><div class="row"><span class="pill mint">F · Früh</span><span class="pill amber">S · Spät</span><span class="pill soft">N · Nacht</span><span class="pill soft">— · Frei</span></div></div></div>
      <aside class="card glass"><div class="card-header"><h2 class="section-label">Planprüfung</h2><span class="pill amber">Hinweis</span></div><p class="subtle">Vorgesehener Ort für echte serverseitige Konfliktmeldungen.</p><div class="check-item"><b>⚠ Ruhezeit prüfen</b><p>Beispielkonflikt: Übergang Nacht → Früh. Im Produkt muss die tatsächliche Fachprüfung entscheiden.</p></div><div class="row" style="margin-top:19px">${btn('Beispielkonflikt ansehen','example-conflict','','btn primary')}</div><p class="tiny" style="margin-top:21px">Die Änderung einzelner Schichten unten ist nur eine lokale UI-Simulation. Sie wird nicht gespeichert oder an den Server gesendet.</p></aside></div></section>`}
    function personal(){const people=PEOPLE.filter(p=>p.name.toLowerCase().includes(state.search.toLowerCase())&&(state.team==='Alle'||p.team===state.team));const p=PEOPLE.find(p=>p.id===state.person)||PEOPLE[0];return `<section><div class="page-head"><div><div class="eyebrow">Team / Personal</div><h1>Menschen & Kompetenzen<span style="color:var(--accent)">.</span></h1><p class="lead">Master-Detail-Vorschau: Listen, Suche, Qualifikationen und Profilkarten.</p></div></div><div class="person-layout"><article class="card"><div class="card-header"><h2 class="section-label">Mitarbeitende</h2><span class="pill soft">${people.length} Personen</span></div><label class="visually-hidden" for="personSearch">Personal suchen</label><input id="personSearch" class="field" placeholder="Name suchen …" value="${E(state.search)}" data-input="person-search"><div class="person-list" style="margin-top:13px">${people.length?people.map(o=>`<button class="person-button ${p.id===o.id?'active':''}" data-action="person" data-id="${o.id}"><span class="avatar">${E(o.initials)}</span><span><b>${E(o.name)}</b><small>Team ${o.team} · ${E(o.role)}</small></span></button>`).join(''):'<p class="subtle" style="padding:15px">Keine Treffer.</p>'}</div></article><article class="card"><div class="profile-title"><div class="avatar">${E(p.initials)}</div><div><h2>${E(p.name)}</h2><span class="subtle">Team ${p.team} · ${E(p.role)}</span></div></div><div class="tabs" role="tablist" aria-label="Personaldetails">${['Profil','Qualifikationen','Schichten'].map(tab=>`<button role="tab" aria-selected="${state.personTab===tab}" data-action="person-tab" data-tab="${tab}">${tab}</button>`).join('')}</div>
      ${state.personTab==='Profil'?`<div class="profile-grid"><div class="datum"><small>Einheit</small><strong>Team ${p.team}</strong></div><div class="datum"><small>Funktion</small><strong>${E(p.role)}</strong></div><div class="datum"><small>Verfügbarkeit</small><strong>Im Demo aktiv</strong></div><div class="datum"><small>Nächster Dienst</small><strong>${E(SHIFTS[p.shifts.find(s=>s!=='-')].label)}</strong></div></div><div class="tiny">Dies ist ein reines Musterprofil, keine echte Personalakte.</div>`:''}
      ${state.personTab==='Qualifikationen'?`<div style="margin-top:21px"><div class="qual"><div><strong>${E(p.quali)}</strong><small>Gültig bis ${E(p.expiry)}</small></div><span class="pill ${p.id==='p4'?'amber':'mint'}">${p.id==='p4'?'Bald fällig':'Gültig'}</span></div><div class="qual"><div><strong>Unterweisung</strong><small>Nachweis im Testprofil</small></div><span class="pill mint">Gültig</span></div></div><div class="row" style="margin-top:20px">${btn('Nachweisvorschau öffnen','show-qualification','','btn primary')}</div>`:''}
      ${state.personTab==='Schichten'?`<div style="margin-top:18px">${p.shifts.map((s,i)=>`<div class="shift-line"><b>${DAYS[i]} ${DATES[i]}.11.</b><span class="pill soft">${E(SHIFTS[s].label)} · ${SHIFTS[s].time}</span></div>`).join('')}</div>`:''}</article></div></section>`}
    function operator(){const tabs=['Übersicht','Mandanten','Rechnungen','Sicherheit'];return `<section><div class="page-head"><div><div class="eyebrow">Plattform / Betreiberkonsole</div><h1>Deine Plattform.<br><span style="color:var(--accent)">Alles im Blick.</span></h1><p class="lead">Verträge und Betrieb – ohne Zugriff auf Beschäftigtendaten deiner Kunden.</p></div><span class="pill soft">Betreibervorschau</span></div><div class="toolbar"><div class="tabs" role="tablist" aria-label="Betreiberbereiche">${tabs.map(t=>`<button role="tab" data-action="operator-tab" data-tab="${t}" aria-selected="${state.operatorTab===t}">${t}</button>`).join('')}</div></div>
      ${state.operatorTab==='Übersicht'?`<div class="metric-grid">${metric('Aktive Betriebe','28','▣','Illustrative Zahl')}${metric('Offene Rechnungen','4','▤','Illustrative Zahl')}${metric('Demo-Zugänge','3','◈','Illustrative Zahl')}${metric('Zugangsschutz','2FA','◉','Konzeptstatus')}</div><div class="two-col">${clientTable()}<aside class="card glass"><div class="card-header"><h2 class="section-label">Jetzt prüfen</h2><span class="pill amber">2 Hinweise</span></div><button class="task" data-action="toast" data-message="Adressänderung in der Vorschau ausgewählt."><span><strong>2 Adressänderungen</strong><small>Verifizierung ausstehend</small></span><span class="arrow">→</span></button><button class="task" data-action="operator-tab" data-tab="Rechnungen"><span><strong>4 Rechnungen offen</strong><small>Abrechnungsvorschau prüfen</small></span><span class="arrow">→</span></button></aside></div>`:''}
      ${state.operatorTab==='Mandanten'?`<div class="row between" style="margin-bottom:15px"><h2 class="section-label">Mandantenübersicht</h2>${btn('+ Beispielmandant','new-client','','btn primary')}</div>${clientTable()}`:''}
      ${state.operatorTab==='Rechnungen'?`<div class="card"><div class="card-header"><div><h2 class="section-label">Abrechnungsmonat November 2026</h2><p class="subtle">Keine echten Beträge oder Zahlungsvorgänge</p></div>${btn('Vorschau öffnen','invoice-preview','','btn primary')}</div><div class="operator-mini"><div class="card"><small>Mandanten mit Abrechnung</small><strong>28</strong></div><div class="card"><small>Offen</small><strong>4</strong></div><div class="card"><small>Freigegeben</small><strong>—</strong></div></div><div class="check-item"><b>Nur Demonstration</b><p>Rechnungen werden hier nicht erzeugt, versendet oder verändert.</p></div></div>`:''}
      ${state.operatorTab==='Sicherheit'?`<div class="two-col"><div class="card"><h2 class="section-label">Betreiberzugang</h2><div class="qual"><div><strong>Zwei-Faktor-Authentifizierung</strong><small>Demoanzeige ohne echte Anmeldung</small></div><span class="pill mint">Vorgesehen</span></div><div class="qual"><div><strong>Mandantentrennung</strong><small>Keine Dienstplan- oder Personaldaten in der Konsole</small></div><span class="pill mint">Prinzip</span></div><div class="row" style="margin-top:22px">${btn('Sicherheitsdetails','security-info','','btn primary')}</div></div><div class="card glass"><h2 class="section-label">Wichtiger Hinweis</h2><p class="subtle" style="margin-top:12px">Diese Designvorschau besitzt keine echte Authentifizierung. Sie ist kein sicherer Administrationszugang und verarbeitet keine Kundendaten.</p></div></div>`:''}</section>`}
    function clientTable(){return `<div class="card"><div class="card-header"><h2 class="section-label">Mandanten & Abrechnung</h2><span class="pill soft">Beispieldaten</span></div><div class="owner-table-wrap"><table class="owner-table"><thead><tr><th scope="col">Betrieb</th><th scope="col">Status</th><th scope="col">Tarif</th><th scope="col">Intervall</th><th scope="col">Aktion</th></tr></thead><tbody>${CLIENTS.map(c=>`<tr><td>${E(c.name)}</td><td><span class="pill ${c.status==='Aktiv'?'mint':'amber'}">${c.status}</span></td><td>${c.tariff}</td><td>${c.cycle}</td><td>${btn('Öffnen','client',`data-id="${c.id}"`,'btn small')}</td></tr>`).join('')}</tbody></table></div></div>`}
    function website(){return `<section class="website"><div class="web-nav glass"><div class="row">${brandLogo()}</div><nav class="web-nav-links" aria-label="Website-Navigation">${['Funktionen','Branchen','Sicherheit'].map(t=>`<button data-action="web-anchor" data-target="web-features">${t}</button>`).join('')}</nav>${btn('App öffnen ↗','view','data-view="lage"','btn primary small')}</div><div class="web-hero"><div><div class="eyebrow">Ein System für anspruchsvolle Schichtbetriebe</div><h1>Dienstplanung, <span style="color:var(--accent)">die Klarheit schafft.</span></h1><p>Planen. Koordinieren. Entscheiden.</p>${btn('CENTRIC kennenlernen →','web-anchor','data-target="web-features"','btn primary')}</div><div class="product-stage"><div class="mock-window"><div class="mock-top"><strong>Wochenübersicht</strong><span class="mock-dots">● ● ●</span></div>${[['Team A','F','F','S','S'],['Team B','S','N','F','F'],['Team C','N','N','S','F']].map(row=>`<div class="mock-row">${row.map((x,i)=>`<span class="${i===0?'':x==='S'?'amber':'fill'}">${x}</span>`).join('')}</div>`).join('')}<div class="floating"><small>Besetzung heute</small><b>12 / 12</b><span class="tiny" style="color:#315e54">Beispielansicht</span></div></div></div></div><div class="web-features" id="web-features"><article class="card glass"><span class="web-feature-num">01 / PLANUNG</span><h3>Schichten verständlich planen.</h3><p>Planungsstände, Änderungen und Besetzung in einem nachvollziehbaren Ablauf.</p></article><article class="card glass"><span class="web-feature-num">02 / TEAM</span><h3>Entscheidungen im Kontext.</h3><p>Anträge und Aufgaben genau dort bearbeiten, wo sie entstehen.</p></article><article class="card glass"><span class="web-feature-num">03 / ÜBERBLICK</span><h3>Weniger suchen. Mehr verstehen.</h3><p>Die wichtigsten Informationen werden strukturiert statt dekorativ präsentiert.</p></article></div><div class="tiny" style="margin-top:30px">Nur Konzeptvorschau. Keine Aussagen zur Verfügbarkeit konkreter Funktionen oder gesetzlichen Konformität.</div></section>`}
    function monthHtml(){const names=['So','Mo','Di','Mi','Do','Fr','Sa'];const cells=Array.from({length:6},()=>'<span class="month-day empty" aria-hidden="true"></span>');for(let i=1;i<=30;i++){const inRange=i>=2&&i<=8;const coverage=inRange?(i===7?'83 %':i===8?'91 %':'100 %'):'—';cells.push(`<button class="month-day ${inRange?'in-range':''}" data-action="month-day" data-day="${i}"><strong>${i}</strong><span>${names[(i-1)%7]}</span><small>${coverage}</small></button>`)}return `<div class="card" style="margin-bottom:16px"><div class="card-header"><h2 class="section-label">November 2026 · Monatsübersicht</h2><span class="pill soft">Demo 02.–08.11.</span></div><div class="month-grid">${cells.join('')}</div><p class="tiny" style="margin-top:13px">Nur die Tage 02.–08. November sind in dieser Designvorschau mit editierbaren Musterschichten belegt. Die übrigen Tage dienen der Monatsdarstellung.</p></div>`}
    function modal(){if(!state.modal)return '';const m=state.modal;let body='';if(m.type==='shift'){const p=PEOPLE.find(p=>p.id===m.id);body=`<h2>Schicht bearbeiten</h2><p class="subtle">${E(p.name)} · ${DAYS[m.day]}, ${DATES[m.day]}. November</p><label for="shiftSelect">Schichtart</label><select id="shiftSelect" class="field">${Object.entries(SHIFTS).map(([v,s])=>`<option value="${v}" ${p.shifts[m.day]===v?'selected':''}>${s.label} · ${s.time}</option>`).join('')}</select><p class="tiny" style="margin-top:13px">Änderungen gelten nur in dieser Browser-Vorschau und werden nicht fachlich validiert.</p><div class="buttons">${btn('Abbrechen','close-modal','','btn ghost')}${btn('In Vorschau übernehmen','save-shift','','btn primary')}</div>`}else if(m.type==='client'){const c=CLIENTS.find(c=>c.id===m.id);body=`<h2>${E(c.name)}</h2><p class="subtle">Kommerzielle Mandantenansicht · nur Beispiel</p><div class="profile-grid"><div class="datum"><small>Tarif</small><strong>${c.tariff}</strong></div><div class="datum"><small>Status</small><strong>${c.status}</strong></div><div class="datum"><small>Branche</small><strong>${c.sector}</strong></div><div class="datum"><small>Abrechnung</small><strong>${c.cycle}</strong></div></div><div class="buttons">${btn('Schließen','close-modal','','btn primary')}</div>`}else{body=`<h2>${E(m.title)}</h2><p class="subtle">${E(m.description)}</p><div class="check-item"><b>Vorschau ohne Backend</b><p>Hier wird keine produktive Aktion ausgeführt, kein Datensatz geschrieben und keine Berechtigung erteilt.</p></div><div class="buttons">${btn('Schließen','close-modal','','btn primary')}</div>`}return `<div class="dialog-backdrop" id="dialogBackdrop"><div class="dialog glass" role="dialog" aria-modal="true" aria-label="${E(m.type==='shift'?'Schicht bearbeiten':m.title||'Details')}">${body}</div></div>`}
    function render(){document.body.dataset.theme=state.theme;document.body.dataset.plan=state.planMode.toLowerCase();document.body.classList.toggle('no-glass',!state.glass);$('#app').innerHTML=`<div class="nav-shade ${state.nav?'open':''}" data-action="menu"></div><div class="shell">${nav()}<div class="main">${top()}<main class="content" id="mainContent">${({lage,plan,personal,betreiber:operator,website})[state.view]()}</main></div></div>${mobileFoot()}${modal()}${state.toast?`<div class="toast" role="status">${E(state.toast)}</div>`:''}`;if(state.view==='plan'&&state.planMode==='Monat'){const toolbar=$('#mainContent .toolbar');toolbar?.insertAdjacentHTML('afterend',monthHtml())}document.title='CENTRIC V4 Glass · '+VIEWS.find(v=>v[0]===state.view)?.[1];}
    function notify(msg){state.toast=msg;clearTimeout(toastTimer);render();toastTimer=setTimeout(()=>{state.toast='';render()},3500)}
    function setView(view){if(!VIEWS.some(v=>v[0]===view))return;state.view=view;state.nav=false;state.modal=null;state.search='';window.scrollTo({top:0,behavior:'instant'});render()}
    document.addEventListener('input',e=>{if(e.target.dataset.input==='person-search'){state.search=e.target.value;const active=$('.person-list');if(!active)return;const matched=PEOPLE.filter(p=>p.name.toLowerCase().includes(state.search.toLowerCase()));active.innerHTML=matched.map(p=>`<button class="person-button ${p.id===state.person?'active':''}" data-action="person" data-id="${p.id}"><span class="avatar">${E(p.initials)}</span><span><b>${E(p.name)}</b><small>Team ${p.team} · ${E(p.role)}</small></span></button>`).join('')||'<p class="subtle">Keine Treffer.</p>';}});
    document.addEventListener('change',e=>{if(e.target.dataset.select==='team'){state.team=e.target.value;render()}});
    document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;switch(action){
      case 'view':setView(b.dataset.view);break;
      case 'menu':state.nav=!state.nav;render();break;
      case 'theme':state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('centric-v4-theme',state.theme);render();break;
      case 'glass':state.glass=!state.glass;localStorage.setItem('centric-v4-glass',state.glass?'on':'off');render();break;
      case 'person':state.person=b.dataset.id;render();break;
      case 'person-tab':state.personTab=b.dataset.tab;render();break;
      case 'day':state.day=Number(b.dataset.day);render();break;
      case 'plan-mode':state.planMode=b.dataset.mode;state.day=2;render();break;
      case 'month-day':{const n=Number(b.dataset.day);if(n>=2&&n<=8){state.day=n-2;state.planMode='Tag';render()}else notify('Für diesen Tag liegen in der Vorschau keine Musterschichten vor.');break}
      case 'operator-tab':state.operatorTab=b.dataset.tab;render();break;
      case 'edit-shift':state.modal={type:'shift',id:b.dataset.id,day:Number(b.dataset.day)};render();setTimeout(()=>$('#shiftSelect')?.focus(),0);break;
      case 'save-shift':{const p=PEOPLE.find(p=>p.id===state.modal?.id);if(p){p.shifts[state.modal.day]=$('#shiftSelect')?.value||'-';state.modal=null;notify('Beispielschicht aktualisiert – nur in dieser Vorschau.')}break}
      case 'close-modal':state.modal=null;render();break;
      case 'reset-plan':PEOPLE.forEach((p,i)=>{p.shifts=[['F','F','S','S','F','-','-'],['S','S','N','-','F','F','S'],['F','-','F','S','S','S','-'],['N','-','N','N','S','S','-'],['F','S','S','F','F','-','N'],['N','N','-','F','S','S','-']][i].slice()});notify('Demo-Dienstplan zurückgesetzt.');break;
      case 'client':state.modal={type:'client',id:b.dataset.id,title:'Mandantendetails'};render();break;
      case 'example-conflict':state.modal={type:'info',title:'Beispielkonflikt: Ruhezeit',description:'Der echte CENTRIC-Server müsste den Schichtwechsel mit seiner Fachprüfung bewerten. Hier ist lediglich die Darstellung des Konflikts simuliert.'};render();break;
      case 'show-qualification':state.modal={type:'info',title:'Nachweisvorschau',description:'Qualifikationsnachweise erfordern echte Zugriffs- und Dateiprüfung. Diese Demo besitzt keine Dokumentenablage.'};render();break;
      case 'invoice-preview':state.modal={type:'info',title:'Rechnungsvorschau',description:'In der echten Betreiberkonsole müssen Belege, Tarifdaten, Korrekturen und Freigaben aus dem Backend stammen. Diese Vorschau zeigt nur den Ablauf.'};render();break;
      case 'security-info':state.modal={type:'info',title:'Zwei-Faktor-Sicherheit',description:'Die sichere 2FA-Einrichtung gehört in die reale Anmeldung. Diese Designvorschau bietet keine Zugangskontrolle.'};render();break;
      case 'new-client':state.modal={type:'info',title:'Mandant anlegen',description:'Eine produktive Mandantenanlage wäre eine gesicherte Backendaktion. Hier wird nur das Dialogkonzept dargestellt.'};render();break;
      case 'toast':notify(b.dataset.message||'Aktion in der Vorschau ausgewählt.');break;
      case 'web-anchor':document.getElementById(b.dataset.target)?.scrollIntoView({behavior:'smooth'});break;
    }});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){state.modal=null;render()}else if(state.nav){state.nav=false;render()}}});
    render();
  })();
  </script>
</body>
</html>
